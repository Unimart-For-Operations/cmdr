services:
  linux-test:
    # Ubuntu 24.04 LTS - works cleanly on both x86_64 and Apple Silicon
    # Tests cross-platform Nix config compatibility
    # Run with: docker compose up --build
    platform: linux/amd64
    
    build:
      context: ..
      dockerfile: containers/Dockerfile
      platforms:
        - linux/amd64
    
    # Mount the repo as read-only to prevent accidental modifications.
    # The parent meta repo is mounted so the container test can override the
    # git+ssh meta input with a local path copy (git+ssh re-fetches recompute
    # the input's narHash with the container's bundled libgit2, which can
    # differ from the host's and fail the lock check). Local + ephemeral.
    volumes:
      - ..:/workspace:ro
      - ${HOME}/repos/meta:/meta:ro
    
    # Keep container running for interactive use
    stdin_open: true
    tty: true
    
    # Container name for easy reference
    container_name: dev-control-plane-linux
    
    # Environment variables
    environment:
      - TERM=xterm-256color
    
    # Working directory
    working_dir: /home/nixuser
    
    # Use zsh as default shell (entrypoint handles Nix installation)
    command: ["/home/nixuser/entrypoint.sh"]

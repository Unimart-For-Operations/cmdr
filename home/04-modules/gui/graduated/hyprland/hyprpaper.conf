# Hyprpaper configuration — static wallpaper
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprpaper/
#
# Place your wallpaper at ~/Pictures/Wallpapers/wallpaper.png
# or update the path below to match your preferred wallpaper.
# (DMS hosts use matugen-generated wallpapers instead.)

preload = ~/Pictures/Wallpapers/wallpaper.png

# Apply to all monitors (leave monitor name blank for default)
wallpaper = ,~/Pictures/Wallpapers/wallpaper.png

# Disable splash text on wallpaper
splash = false

# ~/.config/hypr/hyprland.conf
# Seed config — NOT managed by Home Manager (DMS needs to write this file at
# runtime via `dms setup`). To deploy:
#   cp ~/repos/github/412andrewmortimer/dev-control-plane/home/modules/hyprland/hyprland.conf \
#      ~/.config/hypr/hyprland.conf
# DankMaterialShell handles: panel, launcher, notifications, lock screen,
# idle detection, audio/brightness controls, clipboard history UI.

# ── Monitors ──────────────────────────────────────────────────────────────────
monitor = ,preferred,auto,auto

# ── Programs ──────────────────────────────────────────────────────────────────
$terminal = kitty
$mainMod  = SUPER

# ── Autostart ─────────────────────────────────────────────────────────────────
# Session is launched via "Hyprland (uwsm-managed)" in plasmalogin.
# UWSM runs Hyprland inside a proper systemd user session scope and handles:
#   - dbus-update-activation-environment
#   - systemctl --user import-environment
#   - graphical-session.target activation
# We just need to call `uwsm finalize` so UWSM gets the WAYLAND_DISPLAY export
# and can declare graphical-session.target reached (unblocking dms.service etc.)
exec-once = uwsm finalize
# DMS is started by its systemd user service (systemd.enable = true in HM config)
exec-once = hyprpaper
exec-once = nm-applet --indicator
exec-once = bash -c 'exec $(ls /nix/store/*/bin/polkit-gnome-authentication-agent-1 2>/dev/null | head -1) || exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1'
exec-once = mkdir -p ~/Pictures/Screenshots
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ── Environment Variables ──────────────────────────────────────────────────────
# Cursor defaults (overridden by ./dms/cursor.conf when DMS manages the cursor).
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Catppuccin-Frappe-Dark-Cursors
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME_QT6,gtk3
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# NVIDIA-specific environment variables (RTX 4080 Mobile)
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1

# ── DMS dynamic config (populated by `dms setup`) ─────────────────────────────
# These files are written by DMS to apply wallpaper-synced colors, gaps, etc.
# They are created empty on first boot; run `dms setup` once after install.
# Paths are relative so DMS's own UI can detect the includes via grep.
# Sourced AFTER the static env block so DMS values (cursor theme, layout, etc.)
# take precedence over the defaults above.
source = ./dms/colors.conf
source = ./dms/outputs.conf
source = ./dms/layout.conf
source = ./dms/cursor.conf
source = ./dms/binds.conf
source = ./dms/windowrules.conf

# ── General ───────────────────────────────────────────────────────────────────
general {
    gaps_in          = 0
    gaps_out         = 0
    border_size      = 0
    col.active_border   = rgba(ca9ee6ff) rgba(85c1dcff) 45deg
    col.inactive_border = rgba(626880ff)
    resize_on_border = true
    allow_tearing    = false
    layout           = dwindle
}

# ── Decoration ────────────────────────────────────────────────────────────────
decoration {
    rounding       = 12
    rounding_power = 2
    active_opacity   = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled      = true
        range        = 30
        render_power = 5
        offset       = 0 5
        color        = rgba(00000070)
    }

    blur {
        enabled  = true
        size     = 6
        passes   = 3
        vibrancy = 0.1696
    }
}

# ── Animations ────────────────────────────────────────────────────────────────
animations {
    enabled = true

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1.0
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 1.94, almostLinear, fade
    animation = workspacesIn,  1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# ── Input ─────────────────────────────────────────────────────────────────────
input {
    kb_layout    = us
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll       = true
        disable_while_typing = true
        tap-to-click         = true
        scroll_factor        = 0.8
    }
}

# ── Gestures ──────────────────────────────────────────────────────────────────
gestures {
    workspace_swipe_touch = true
}

# ── Layout: Dwindle ───────────────────────────────────────────────────────────
dwindle {
    pseudotile     = true
    preserve_split = true
}

# ── Misc ──────────────────────────────────────────────────────────────────────
misc {
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
}

# ── Layer Rules ───────────────────────────────────────────────────────────────
# Disable animations on DMS layers for smooth shell rendering.
# DMS layer namespaces use the prefix pattern "dms:*" (e.g. dms:bar, dms:spotlight).
# Use flat inline syntax — the block-syntax variant is not compatible with
# the Hyprland version on CachyOS and would silently cause a config parse error.
layerrule = no_anim on, match:namespace ^(quickshell)$
layerrule = no_anim on, match:namespace ^dms:.*

# ── Window Rules ──────────────────────────────────────────────────────────────
# Use flat inline syntax for compatibility with the Hyprland version on CachyOS.
# The block-syntax variant requires Hyprland ≥ 0.46 and would silently cause a
# config parse failure on older versions, leaving a bare black desktop.

# DMS/quickshell windows — float by default
# NOTE: DMS's own setup comment says Hyprland doesn't size these correctly when
# floated, so this is intentionally commented out (same as DMS default binds).
# windowrule = float on, match:class ^(org.quickshell)$

# Float common dialogs
windowrule = float on, match:class ^(file_progress)$
windowrule = float on, match:class ^(confirm)$
windowrule = float on, match:class ^(dialog)$
windowrule = float on, match:class ^(download)$
windowrule = float on, match:class ^(notification)$
windowrule = float on, match:class ^(error)$
windowrule = float on, match:class ^(splash)$
windowrule = float on, match:class ^(Thunar)$, match:title (?!.*- Thunar$)
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(polkit-gnome-authentication-agent-1)$

# Picture-in-picture
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on,   match:title ^(Picture-in-Picture)$

# Suppress maximize requests from all apps
windowrule = suppress_event maximize, match:class .*

# ── Keybinds ──────────────────────────────────────────────────────────────────
# Applications
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E,      exec, $terminal -e yazi
bind = $mainMod, B,      exec, firefox

# DankMaterialShell IPC
bind = $mainMod, Space,   exec, dms ipc call spotlight toggle
bind = $mainMod, V,       exec, dms ipc call clipboard toggle
bind = $mainMod, N,       exec, dms ipc call notifications toggle
bind = $mainMod, M,       exec, dms ipc call processlist focusOrToggle
bind = $mainMod, comma,   exec, dms ipc call settings focusOrToggle
bind = $mainMod, Y,       exec, dms ipc call dankdash wallpaper
bind = $mainMod, TAB,     exec, dms ipc call hypr toggleOverview
bind = $mainMod ALT, L,   exec, dms ipc call lock lock

# Window management
bind = $mainMod, Q,           killactive
bind = $mainMod, F,           fullscreen, 0
bind = $mainMod SHIFT, F,     togglefloating
bind = $mainMod, P,           pseudo
bind = $mainMod, J,           togglesplit
bind = $mainMod, left,        movefocus, l
bind = $mainMod, right,       movefocus, r
bind = $mainMod, up,          movefocus, u
bind = $mainMod, down,        movefocus, d
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Workspace scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Special workspace (scratchpad)
bind = $mainMod, S,           togglespecialworkspace, magic
bind = $mainMod SHIFT, minus, movetoworkspace, special:magic

# Screenshots (grim + slurp)
bind = , Print,           exec, grim ~/Pictures/Screenshots/$(date +'%Y%m%d_%H%M%S').png
bind = SHIFT, Print,      exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y%m%d_%H%M%S').png
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# ── Media / Volume / Brightness ───────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, dms ipc call audio increment 3
bindel = , XF86AudioLowerVolume,  exec, dms ipc call audio decrement 3
bindel = , XF86MonBrightnessUp,   exec, dms ipc call brightness increment 5
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5

bindl = , XF86AudioMute,     exec, dms ipc call audio mute
bindl = , XF86AudioMicMute,  exec, pamixer --default-source -t
bindl = , XF86AudioPlay,     exec, playerctl play-pause
bindl = , XF86AudioPrev,     exec, playerctl previous
bindl = , XF86AudioNext,     exec, playerctl next

# ── Mouse Binds ───────────────────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

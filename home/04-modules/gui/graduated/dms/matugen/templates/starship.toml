# DMS matugen starship prompt theme — auto-generated, do not edit.
# On DMS hosts matugen owns the entire ~/.config/starship.toml (starship reads a
# single config file, no include/merge mechanism), so this template mirrors the
# structure of home/04-modules/cli/graduated/starship/default.nix with matugen
# color placeholders. Non-DMS hosts keep the Catppuccin settings from that module.
#
# Semantic roles align with the matugen templates in this dir (see opencode.json):
#   mauve    -> colors.primary
#   pink     -> colors.tertiary
#   peach    -> dank16.color3
#   sapphire -> colors.primary
#   green    -> dank16.color2
#   blue     -> dank16.color4
#   base     -> colors.background

format = "[]({{colors.primary.default.hex}})$os$username[](bg:{{colors.tertiary.default.hex}} fg:{{colors.primary.default.hex}})$directory[](fg:{{colors.tertiary.default.hex}} bg:{{dank16.color3.default.hex}})$git_branch$git_status$terraform[](fg:{{dank16.color3.default.hex}} bg:{{colors.primary.default.hex}})$c$elixir$elm$golang$gradle$haskell$java$julia$nodejs$nim$rust$scala[](fg:{{colors.primary.default.hex}} bg:{{dank16.color2.default.hex}})$docker_context[](fg:{{dank16.color2.default.hex}} bg:{{dank16.color4.default.hex}})$time[ ](fg:{{dank16.color4.default.hex}})"

[username]
show_always = true
style_user = "bg:{{colors.primary.default.hex}} fg:{{colors.background.default.hex}}"
style_root = "bg:{{colors.primary.default.hex}} fg:{{colors.background.default.hex}}"
format = "[$user ]($style)"
disabled = false

[os]
style = "bg:{{colors.primary.default.hex}} fg:{{colors.background.default.hex}}"
disabled = true

[directory]
style = "bg:{{colors.tertiary.default.hex}} fg:{{colors.background.default.hex}}"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
substitutions = { Documents = "󰈙 ", Downloads = " ", Music = " ", Pictures = " " }

[git_branch]
symbol = ""
style = "bg:{{dank16.color3.default.hex}} fg:{{colors.background.default.hex}}"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:{{dank16.color3.default.hex}} fg:{{colors.background.default.hex}}"
format = "[$all_status$ahead_behind ]($style)"

[terraform]
symbol = "󱁢 "
style = "bg:{{dank16.color3.default.hex}} fg:{{colors.background.default.hex}}"
format = "[ $symbol $workspace ]($style)"
detect_extensions = ["tf", "tfvars"]
detect_files = ["terraform.tfstate"]
detect_folders = [".terraform"]

[c]
symbol = " "
style = "bg:{{colors.primary.default.hex}} fg:{{colors.background.default.hex}}"
format = "[ $symbol ($version) ]($style)"


# DMS matugen tmux theme — auto-generated, do not edit.
# Colors from the active DMS wallpaper theme. Sourced by the tmux module on DMS
# hosts (via if-shell) so these override the Catppuccin defaults in extraConfig.
# Keeps tmux's usual catppuccin-style semantic roles:
#   text  -> colors.on_surface
#   base  -> colors.background
#   surface0 -> colors.surface_container
#   mauve -> colors.primary
#   blue  -> colors.tertiary
#   green -> colors.secondary

# Pane content
setw -g window-style 'fg={{colors.on_surface.default.hex}},bg={{colors.surface_container.default.hex}}'
setw -g window-active-style 'fg={{colors.on_surface.default.hex}},bg={{colors.surface_container.default.hex}}'

# Status bar
set -g status-style 'bg={{colors.background.default.hex}} fg={{colors.on_surface.default.hex}}'
set -g status-left '#[fg={{colors.background.default.hex}},bg={{colors.primary.default.hex}},bold] #S #[fg={{colors.primary.default.hex}},bg={{colors.background.default.hex}}]'
set -g status-left-length 40
set -g status-right '#{?#{continuum_status},#[fg={{colors.secondary.default.hex}}]  #{continuum_status} ,}#[fg={{colors.surface_container.default.hex}},bg={{colors.background.default.hex}}]#[fg={{colors.primary.default.hex}},bg={{colors.surface_container.default.hex}}] %d/%m #[fg={{colors.surface_container.default.hex}},bg={{colors.surface_container.default.hex}}]#[fg={{colors.background.default.hex}},bg={{colors.tertiary.default.hex}},bold] %H:%M:%S '
set -g status-right-length 60

# Window status
setw -g window-status-style 'fg={{colors.on_surface.default.hex}} bg={{colors.surface_container.default.hex}}'
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-style 'fg={{colors.background.default.hex}} bg={{colors.primary.default.hex}} bold'
setw -g window-status-current-format ' #I:#W#F '

# Pane borders
set -g pane-border-style 'fg={{colors.primary.default.hex}}'
set -g pane-active-border-style 'fg={{colors.primary.default.hex}}'

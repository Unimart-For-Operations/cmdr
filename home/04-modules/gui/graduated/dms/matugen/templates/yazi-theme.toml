# DMS matugen yazi theme — auto-generated, do not edit.
# Colors from the active DMS wallpaper theme. Written by the dms/matugen module
# to ~/.config/yazi/theme.toml on DMS hosts (HM skips it there; see
# tui/graduated/yazi). Uses catppuccin-style semantic roles:
#   text       -> colors.on_surface
#   base       -> colors.background
#   mantle     -> colors.surface_container_lowest
#   surface0   -> colors.surface_container
#   surface1   -> colors.surface_container_high
#   surface2   -> colors.outline
#   overlay1   -> colors.on_surface_variant
#   mauve      -> colors.primary
#   blue       -> dank16.color4
#   green      -> dank16.color2
#   teal       -> dank16.color6
#   yellow     -> dank16.color3
#   peach      -> dank16.color3
#   red        -> colors.error
#   rosewater  -> colors.tertiary
[confirm.border]
fg = '{{dank16.color4.default.hex}}'

[confirm.btn_no]
bg = '{{colors.error.default.hex}}'
fg = '{{colors.background.default.hex}}'

[confirm.btn_yes]
bg = '{{dank16.color2.default.hex}}'
fg = '{{colors.background.default.hex}}'

[confirm.title]
fg = '{{dank16.color4.default.hex}}'


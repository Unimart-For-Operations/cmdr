# DMS matugen k9s skin — auto-generated, do not edit.
# Colors from the active DMS wallpaper theme. Written by the dms/matugen module
# to ~/.config/k9s/skins/dank.yaml and selected via settings.k9s.ui.skin on DMS
# hosts (see tui/incubating/k9s). Uses catppuccin-style semantic roles:
#   text       -> colors.on_surface
#   base       -> colors.background
#   mantle     -> colors.surface_container_lowest
#   surface0   -> colors.surface_container
#   surface1   -> colors.surface_container_high
#   overlay0   -> colors.outline
#   overlay1   -> colors.on_surface_variant
#   overlay2   -> colors.outline
#   subtext0   -> colors.outline
#   mauve      -> colors.primary
#   lavender   -> colors.primary
#   blue       -> dank16.color4
#   green      -> dank16.color2
#   teal       -> dank16.color6
#   yellow     -> dank16.color3
#   peach      -> dank16.color3
#   red        -> colors.error
#   maroon     -> colors.error
#   pink       -> colors.tertiary
#   rosewater  -> colors.tertiary
#   flamingo   -> colors.tertiary
k9s:
  body:
    fgColor: '{{colors.on_surface.default.hex}}'
    bgColor: '{{colors.background.default.hex}}'
    logoColor: '{{colors.primary.default.hex}}'
  prompt:
    fgColor: '{{colors.on_surface.default.hex}}'
    bgColor: '{{colors.surface_container_lowest.default.hex}}'
    suggestColor: '{{dank16.color4.default.hex}}'
  help:
    fgColor: '{{colors.on_surface.default.hex}}'
    bgColor: '{{colors.background.default.hex}}'
    sectionColor: '{{dank16.color2.default.hex}}'
    keyColor: '{{dank16.color4.default.hex}}'
    numKeyColor: '{{colors.error.default.hex}}'
  frame:
    title:
      fgColor: '{{dank16.color6.default.hex}}'
      bgColor: '{{colors.background.default.hex}}'
      highlightColor: '{{colors.tertiary.default.hex}}'
      counterColor: '{{dank16.color3.default.hex}}'
      filterColor: '{{dank16.color2.default.hex}}'
    border:
      fgColor: '{{colors.primary.default.hex}}'
      focusColor: '{{colors.primary.default.hex}}'
    menu:
      fgColor: '{{colors.on_surface.default.hex}}'
      keyColor: '{{dank16.color4.default.hex}}'
      numKeyColor: '{{colors.error.default.hex}}'
    crumbs:
      fgColor: '{{colors.background.default.hex}}'
      bgColor: '{{colors.error.default.hex}}'
      activeColor: '{{colors.on_surface.default.hex}}'
    status:
      newColor: '{{dank16.color4.default.hex}}'
      modifyColor: '{{colors.tertiary.default.hex}}'
      addColor: '{{dank16.color2.default.hex}}'
      pendingColor: '{{dank16.color3.default.hex}}'
      errorColor: '{{colors.error.default.hex}}'
      highlightColor: '{{dank16.color6.default.hex}}'
      killColor: '{{colors.error.default.hex}}'
      completedColor: '{{colors.outline.default.hex}}'
  info:
    fgColor: '{{dank16.color3.default.hex}}'
    sectionColor: '{{colors.on_surface.default.hex}}'
  views:
    table:
      fgColor: '{{colors.on_surface.default.hex}}'
      bgColor: '{{colors.background.default.hex}}'
      cursorFgColor: '{{colors.on_surface.default.hex}}'
      cursorBgColor: '{{colors.surface_container_high.default.hex}}'
      markColor: '{{colors.tertiary.default.hex}}'
      header:
        fgColor: '{{dank16.color3.default.hex}}'
        bgColor: '{{colors.background.default.hex}}'
        sorterColor: '{{dank16.color6.default.hex}}'
    xray:
      fgColor: '{{colors.on_surface.default.hex}}'
      bgColor: '{{colors.background.default.hex}}'
      cursorColor: '{{colors.surface_container_high.default.hex}}'
      cursorTextColor: '{{colors.on_surface.default.hex}}'
      graphicColor: '{{colors.tertiary.default.hex}}'
    charts:
      bgColor: '{{colors.background.default.hex}}'
      chartBgColor: '{{colors.background.default.hex}}'
      dialBgColor: '{{colors.background.default.hex}}'
      defaultDialColors: ['{{dank16.color2.default.hex}}', '{{colors.error.default.hex}}']
      defaultChartColors: ['{{dank16.color2.default.hex}}', '{{colors.error.default.hex}}']
      resourceColors:
        cpu: ['{{colors.primary.default.hex}}', '{{dank16.color4.default.hex}}']
        mem: ['{{dank16.color3.default.hex}}', '{{dank16.color3.default.hex}}']
    yaml:
      keyColor: '{{dank16.color4.default.hex}}'
      valueColor: '{{colors.on_surface.default.hex}}'
      colonColor: '{{colors.outline.default.hex}}'
    logs:
      fgColor: '{{colors.on_surface.default.hex}}'
      bgColor: '{{colors.background.default.hex}}'
      indicator:
        fgColor: '{{colors.tertiary.default.hex}}'
        bgColor: '{{colors.background.default.hex}}'
        toggleOnColor: '{{dank16.color2.default.hex}}'
        toggleOffColor: '{{colors.outline.default.hex}}'
  dialog:
    fgColor: '{{dank16.color3.default.hex}}'
    bgColor: '{{colors.surface_container_high.default.hex}}'
    buttonFgColor: '{{colors.on_surface.default.hex}}'
    buttonBgColor: '{{colors.background.default.hex}}'
    buttonFocusFgColor: '{{colors.background.default.hex}}'
    buttonFocusBgColor: '{{colors.tertiary.default.hex}}'
    labelFgColor: '{{colors.tertiary.default.hex}}'
    fieldFgColor: '{{colors.on_surface.default.hex}}'

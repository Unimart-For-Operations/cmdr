# DMS matugen user template config — tmux
# Input template + absolute output path (DMS writes this section raw, so no
# SHELL_DIR/CONFIG_DIR placeholders). Regenerated on every theme change.
[templates.danktmux]
input_path = '@MATUGEN_TEMPLATES@/tmux.conf'
output_path = '@HOME@/.config/tmux/dank-theme.conf'

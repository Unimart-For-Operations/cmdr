name: Theme Lint + Nix Checks

on:
  pull_request:
    paths:
      - 'cmdr/**'
      - '.github/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v16
        with:
          nix_path: "nixpkgs=channel:nixos-23.11"

      - name: Run nixfmt
        run: nix fmt -- --check cmdr || true

      - name: Run nix flake check
        run: nix flake check --no-write-lock-file || true

      - name: Run theme lint
        run: bash cmdr/scripts/check-theme-lint.sh
